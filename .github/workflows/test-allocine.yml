
name: Tester AlloCiné

on:
  workflow_dispatch:

jobs:
  tester:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installer les outils
        run: pip install requests beautifulsoup4

      - name: Tester la récupération AlloCiné
        run: python test_allocine.py
