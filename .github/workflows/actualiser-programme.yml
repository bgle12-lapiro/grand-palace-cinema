name: Actualiser le programme du Grand Palace

on:
  schedule:
    # Chaque mercredi à 07:15 UTC (08:15 en hiver, 09:15 en été en France)
    - cron: '15 7 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualiser:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers de l'application
        uses: actions/checkout@v4

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installer les outils de lecture du programme
        run: pip install requests beautifulsoup4

      - name: Lire le programme et actualiser films.json
        run: |
          import json
          import re
          import unicodedata
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo
          from urllib.parse import urljoin
          
          import requests
          from bs4 import BeautifulSoup, NavigableString, Tag
          
          CINEMA_URL = "https://www.ticketingcine.com/cine/99S05SBN.html"
          HEADERS = {"User-Agent": "Mozilla/5.0 (compatible; GrandPalaceProgrammeBot/1.1)"}
          
          
          def normalize(value):
              value = unicodedata.normalize("NFKD", value or "")
              value = "".join(c for c in value if not unicodedata.combining(c))
              return re.sub(r"[^a-z0-9]+", " ", value.lower()).strip()
          
          
          def slug(value):
              return re.sub(r"[^a-z0-9]+", "-", normalize(value)).strip("-") or "film"
          
          
          def get_page(url):
              response = requests.get(url, headers=HEADERS, timeout=30)
              response.raise_for_status()
              response.encoding = response.apparent_encoding if response.encoding.lower() == "iso-8859-1" else response.encoding
              return BeautifulSoup(response.text, "html.parser")
          
          
          def useful(value):
              return value not in (None, "", "Non renseigné", "Non renseignée")
          
          
          def text_value(value):
              if isinstance(value, str):
                  return value.strip()
              if isinstance(value, dict):
                  return str(value.get("name") or "").strip()
              if isinstance(value, list):
                  return ", ".join(filter(None, (text_value(v) for v in value)))
              return ""
          
          
          def movie_jsonld(soup, title):
              for tag in soup.find_all("script", attrs={"type": "application/ld+json"}):
                  try:
                      obj = json.loads(tag.string or tag.get_text())
                  except (ValueError, TypeError):
                      continue
                  stack = [obj]
                  while stack:
                      node = stack.pop()
                      if isinstance(node, list):
                          stack.extend(node)
                          continue
                      if not isinstance(node, dict):
                          continue
                      stack.extend(v for k, v in node.items() if k in ("@graph", "mainEntity", "itemListElement"))
                      types = node.get("@type", [])
                      if isinstance(types, str):
                          types = [types]
                      if "Movie" in types and normalize(node.get("name", "")) == normalize(title):
                          return node
              return {}
          
          
          def duration_label(value):
              if not isinstance(value, str):
                  return ""
              match = re.fullmatch(r"PT(?:(\d+)H)?(?:(\d+)M)?", value, re.I)
              if match:
                  hours, minutes = int(match.group(1) or 0), int(match.group(2) or 0)
                  return f"{hours} h {minutes:02d}" if hours else f"{minutes} min"
              return ""
          
          
          def extract_metadata(soup, title):
              movie = movie_jsonld(soup, title)
              result = {}
              if movie:
                  genre = text_value(movie.get("genre"))
                  if genre:
                      result["genre"] = genre
                  director = text_value(movie.get("director"))
                  if director:
                      result["director"] = director
                  duration = duration_label(movie.get("duration"))
                  if duration:
                      result["duration"] = duration
                  description = text_value(movie.get("description"))
                  if description and not description.endswith("…"):
                      result["synopsis"] = description
              description_tag = soup.find("meta", attrs={"property": "og:description"})
              image_tag = soup.find("meta", attrs={"property": "og:image"})
              if description_tag and "synopsis" not in result:
                  description = description_tag.get("content", "").strip()
                  if description and not description.endswith(("…", "...")):
                      result["synopsis"] = description
              if image_tag:
                  result["poster"] = urljoin(CINEMA_URL, image_tag.get("content", ""))
              # Les notes ne sont jamais déduites d'une note globale ambiguë.
              # Sans source presse/spectateurs clairement identifiée, on les laisse absentes.
              return result
          
          
          path = "films.json"
          with open(path, "r", encoding="utf-8") as f:
              old_data = json.load(f)
          old_by_title = {normalize(f.get("title", "")): f for f in old_data.get("films", [])}
          
          soup = get_page(CINEMA_URL)
          heading_tags = {"h1", "h2", "h3", "h4", "h5", "h6"}
          film_headings = []
          for tag in soup.find_all(list(heading_tags)):
              match = re.match(r"Les séances du film\s*[-–:]\s*(.+)", tag.get_text(" ", strip=True), re.I)
              if match:
                  film_headings.append((tag, match.group(1).strip()))
          
          today = datetime.now(ZoneInfo("Europe/Paris")).date()
          last_day = today + timedelta(days=14)
          films = []
          for heading, title in film_headings:
              sessions = {}
              current_day = None
              detail_url = None
              for element in heading.next_elements:
                  if isinstance(element, Tag) and element.name in heading_tags:
                      if re.match(r"Les séances du film\s*[-–:]", element.get_text(" ", strip=True), re.I):
                          break
                  if isinstance(element, Tag) and element.name == "a" and detail_url is None:
                      href = element.get("href", "")
                      if "/film/" in href:
                          detail_url = urljoin(CINEMA_URL, href)
                  if isinstance(element, NavigableString):
                      value = str(element).strip()
                      if not value:
                          continue
                      date_match = re.search(r"(\d{2})/(\d{2})/(\d{4})", value)
                      if date_match:
                          day, month, year = map(int, date_match.groups())
                          try:
                              parsed = date(year, month, day)
                              current_day = parsed.isoformat() if today <= parsed <= last_day else None
                          except ValueError:
                              current_day = None
                      if current_day:
                          for match in re.finditer(r"(?<!\d)(\d{1,2})[h:](\d{2})(?!\d)", value, re.I):
                              time = f"{int(match.group(1)):02d}:{match.group(2)}"
                              sessions.setdefault(current_day, []).append(time)
              if not sessions:
                  continue
              old = old_by_title.get(normalize(title), {})
              metadata = {}
              if detail_url:
                  try:
                      metadata = extract_metadata(get_page(detail_url), title)
                  except Exception as exc:
                      print(f"Détails non récupérés pour {title}: {exc}")
              film = {
                  "id": old.get("id") or slug(title),
                  "title": title,
                  "genre": metadata.get("genre") or old.get("genre") or "Non renseigné",
                  "duration": metadata.get("duration") or old.get("duration") or "Non renseignée",
                  "director": metadata.get("director") or old.get("director") or "Non renseigné",
                  "press": old.get("press"),
                  "audience": old.get("audience"),
                  "synopsis": metadata.get("synopsis") or old.get("synopsis") or "",
                  "sessions": {day: sorted(set(times)) for day, times in sessions.items()},
                  "source": detail_url or CINEMA_URL,
                  "poster": old.get("poster") or metadata.get("poster") or "",
              }
              if old.get("posterNote"):
                  film["posterNote"] = old["posterNote"]
              films.append(film)
          
          if len(films) < 3:
              raise SystemExit(f"Arrêt de sécurité : seulement {len(films)} films avec séances trouvés. films.json inchangé.")
          new_data = {
              "cinema": old_data.get("cinema", "Le Grand Palace"),
              "city": old_data.get("city", "Les Sables-d’Olonne"),
              "lastChecked": today.isoformat(),
              "weekLabel": f"Programme actualisé le {today.strftime('%d/%m/%Y')}",
              "films": films,
          }
          with open(path, "w", encoding="utf-8") as f:
              json.dump(new_data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"Programme actualisé : {len(films)} films, du {today} au {last_day}.")

      - name: Publier la mise à jour dans GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add films.json
          if git diff --cached --quiet; then
            echo "Aucun changement du programme à publier."
          else
            git commit -m "Actualisation hebdomadaire du programme cinéma"
            git push
          fi
