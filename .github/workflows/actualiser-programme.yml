name: Actualiser le programme du Grand Palace

on:
  schedule:
    # Tous les lundis à 07:15 UTC (08:15 en hiver, 09:15 en été en France)
    - cron: '15 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualiser:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers de l'application
        uses: actions/checkout@v4

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installer les outils de lecture du programme
        run: pip install requests beautifulsoup4

      - name: Lire le programme et actualiser films.json
        run: |
          python - <<'PY'
          import json
          import re
          import unicodedata
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup, NavigableString, Tag

          CINEMA_URL = "https://www.ticketingcine.com/cine/99S05SBN.html"
          HEADERS = {"User-Agent": "Mozilla/5.0 (compatible; GrandPalaceProgrammeBot/1.0)"}

          def normalize(value):
              value = unicodedata.normalize("NFKD", value or "")
              value = "".join(c for c in value if not unicodedata.combining(c))
              return re.sub(r"[^a-z0-9]+", " ", value.lower()).strip()

          def slug(value):
              return re.sub(r"[^a-z0-9]+", "-", normalize(value)).strip("-") or "film"

          def get_page(url):
              response = requests.get(url, headers=HEADERS, timeout=30)
              response.raise_for_status()
              return BeautifulSoup(response.text, "html.parser")

          path = "films.json"
          with open(path, "r", encoding="utf-8") as f:
              old_data = json.load(f)
          old_films = old_data.get("films", [])
          old_by_title = {normalize(f.get("title", "")): f for f in old_films}

          soup = get_page(CINEMA_URL)
          heading_tags = {"h1", "h2", "h3", "h4", "h5", "h6"}
          film_headings = []
          for tag in soup.find_all(list(heading_tags)):
              text = tag.get_text(" ", strip=True)
              match = re.match(r"Les séances du film\s*[-–:]\s*(.+)", text, re.I)
              if match:
                  film_headings.append((tag, match.group(1).strip()))

          today = datetime.now(ZoneInfo("Europe/Paris")).date()
          last_day = today + timedelta(days=14)
          films = []

          for heading, title in film_headings:
              sessions = {}
              current_day = None
              detail_url = None
              for element in heading.next_elements:
                  if isinstance(element, Tag) and element.name in heading_tags:
                      heading_text = element.get_text(" ", strip=True)
                      if re.match(r"Les séances du film\s*[-–:]", heading_text, re.I):
                          break
                  if isinstance(element, Tag) and element.name == "a" and detail_url is None:
                      href = element.get("href", "")
                      if "/film/" in href:
                          detail_url = urljoin(CINEMA_URL, href)
                  if isinstance(element, NavigableString):
                      value = str(element).strip()
                      if not value:
                          continue
                      date_match = re.search(r"(\d{2})/(\d{2})/(\d{4})", value)
                      if date_match:
                          day, month, year = map(int, date_match.groups())
                          try:
                              parsed = date(year, month, day)
                              current_day = parsed.isoformat() if today <= parsed <= last_day else None
                          except ValueError:
                              current_day = None
                      if current_day:
                          for time_match in re.finditer(r"(?<!\d)(\d{1,2})[h:](\d{2})(?!\d)", value, re.I):
                              time = f"{int(time_match.group(1)):02d}:{time_match.group(2)}"
                              sessions.setdefault(current_day, []).append(time)

              if not sessions:
                  continue

              old = old_by_title.get(normalize(title), {})
              detail_description = ""
              detail_image = ""
              if detail_url:
                  try:
                      detail_soup = get_page(detail_url)
                      description_tag = detail_soup.find("meta", attrs={"property": "og:description"})
                      image_tag = detail_soup.find("meta", attrs={"property": "og:image"})
                      if description_tag:
                          detail_description = description_tag.get("content", "").strip()
                      if image_tag:
                          detail_image = image_tag.get("content", "").strip()
                  except Exception as exc:
                      print(f"Détails non récupérés pour {title}: {exc}")

              film = {
                  "id": old.get("id") or slug(title),
                  "title": title,
                  "genre": old.get("genre") or "Non renseigné",
                  "duration": old.get("duration") or "Non renseignée",
                  "director": old.get("director") or "Non renseigné",
                  "press": old.get("press"),
                  "audience": old.get("audience"),
                  "synopsis": old.get("synopsis") or detail_description,
                  "sessions": sessions,
                  "source": detail_url or CINEMA_URL,
                  "poster": old.get("poster") or detail_image,
              }
              if old.get("posterNote"):
                  film["posterNote"] = old["posterNote"]
              films.append(film)

          if len(films) < 3:
              raise SystemExit(
                  f"Arrêt de sécurité : seulement {len(films)} films avec séances trouvés. "
                  "films.json n'a pas été modifié."
              )

          new_data = {
              "cinema": old_data.get("cinema", "Le Grand Palace"),
              "city": old_data.get("city", "Les Sables-d’Olonne"),
              "lastChecked": today.isoformat(),
              "weekLabel": f"Programme actualisé le {today.strftime('%d/%m/%Y')}",
              "films": films,
          }
          with open(path, "w", encoding="utf-8") as f:
              json.dump(new_data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"Programme actualisé : {len(films)} films, du {today} au {last_day}.")
          PY

      - name: Publier la mise à jour dans GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add films.json
          if git diff --cached --quiet; then
            echo "Aucun changement du programme à publier."
          else
            git commit -m "Actualisation hebdomadaire du programme cinéma"
            git push
          fi
