name: Actualiser le programme du Grand Palace

on:
  schedule:
    - cron: '15 7 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualiser:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4
      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les outils
        run: python -m pip install requests beautifulsoup4
      - name: Actualiser films.json
        shell: bash
        run: |
          python - <<'PYCODE'
          import json, re, unicodedata
          from datetime import datetime, date, timedelta
          from zoneinfo import ZoneInfo
          from urllib.parse import quote, urljoin, unquote
          from html import unescape
          import requests
          from bs4 import BeautifulSoup

          CINEMA_URL = 'https://www.ticketingcine.com/cine/99S05SBN.html'
          HEADERS = {'User-Agent': 'Mozilla/5.0 (compatible; GrandPalaceUpdater/1.0)', 'Accept-Language': 'fr-FR,fr;q=0.9'}
          session = requests.Session()
          session.headers.update(HEADERS)

          # Identifiants connus : ne pas attribuer automatiquement de note sans
          # vérification du titre sur la page cible.
          KNOWN_IDS = {
              'l ile des souvenirs': '296642',
              'quand la mer monte': '57392',
              'la nuit de la glisse 2026 the call': '1000051726',
              'changer l eau des fleurs': '1000018371',
              'camembert': '316136',
              'claude': '1000038378',
              'carlo acutis un saint pour notre temps': '1000040300',
              'la maison de nos reves': '1000031247',
          }

          def norm(s):
              s = unicodedata.normalize('NFKD', str(s or ''))
              s = ''.join(c for c in s if not unicodedata.combining(c))
              return re.sub(r'[^a-z0-9]+', ' ', s.lower()).strip()

          def slug(s):
              return norm(s).replace(' ', '-') or 'film'

          def page(url):
              r = session.get(url, timeout=25)
              r.raise_for_status()
              if r.encoding and r.encoding.lower() == 'iso-8859-1':
                  r.encoding = r.apparent_encoding
              return BeautifulSoup(r.text, 'html.parser')

          def film_ids(raw):
              raw = str(raw or '')
              for _ in range(2):
                  raw = unescape(unquote(raw)).replace('\\/', '/')
              patterns = [
                  r'fichefilm_gen_cfilm\s*=\s*(\d+)',
                  r'allocine\.fr/film/(\d+)(?:/|\.html|[?#]|$)',
                  r'/film/(\d+)(?:/|\.html)',
              ]
              found = []
              for pat in patterns:
                  for n in re.findall(pat, raw, flags=re.I):
                      if n not in found:
                          found.append(n)
              return found

          def titles_match(expected, actual):
              actual = re.split(r'\s+[-–|]\s+AlloCin[eé]', actual or '', flags=re.I)[0]
              return norm(expected) == norm(actual)

          def score(s):
              m = re.search(r'(?<!\d)([0-5])\s*[,.]\s*(\d)(?!\d)', s or '')
              return (m.group(1) + ',' + m.group(2)) if m else None

          def extract_scores(soup):
              # Restreindre les notes à leurs libellés : ne pas confondre avec
              # notes d'avis individuels, bandeaux, films recommandés, etc.
              # Chercher en priorité dans les blocs de notation AlloCiné.
              result = {}
              for block in soup.select('[class*="rating"], [class*="Rating"], [data-testid*="rating"]'):
                  text = block.get_text(' ', strip=True)
                  if len(text) > 250:
                      continue
                  for label, field in (('Presse', 'press'), ('Spectateurs', 'audience')):
                      if field in result or not re.search(r'\b'+label+r'\b', text, re.I):
                          continue
                      match = re.search(r'\b'+label+r'\b.{0,75}?([0-5][,.]\d)\b', text, re.I)
                      if match:
                          result[field] = score(match.group(1))
              # Secours : chercher uniquement dans le début du contenu principal.
              main = soup.select_one('main') or soup
              text = main.get_text(' ', strip=True)[:4500]
              for label, field in (('Presse', 'press'), ('Spectateurs', 'audience')):
                  if field not in result:
                      match = re.search(r'\b'+label+r'\b\s*[:\-]?\s*([0-5][,.]\d)\b', text, re.I)
                      if match:
                          result[field] = score(match.group(1))
              return {k:v for k,v in result.items() if v}

          def allocine_metadata(title, old):
              candidates = []
              def add(raw):
                  for n in film_ids(raw):
                      if n not in candidates:
                          candidates.append(n)
              add(old.get('allocineUrl', ''))
              known = KNOWN_IDS.get(norm(title))
              if known:
                  add('fichefilm_gen_cfilm=' + known)

              # Recherche par titre : les moteurs peuvent bloquer les requêtes.
              searches = [
                  'https://www.allocine.fr/rechercher/?q=' + quote(title),
                  'https://www.bing.com/search?q=' + quote('"'+title+'" site:allocine.fr/film/'),
                  'https://www.google.com/search?q=' + quote('"'+title+'" site:allocine.fr/film/'),
              ]
              for search_url in searches:
                  try:
                      r = session.get(search_url, timeout=15)
                      r.raise_for_status()
                      add(r.text)
                  except requests.RequestException as exc:
                      print('Recherche indisponible:', title, str(exc)[:120])

              for n in candidates[:20]:
                  url = f'https://www.allocine.fr/film/fichefilm_gen_cfilm={n}.html'
                  try:
                      soup = page(url)
                  except requests.RequestException:
                      continue
                  names = []
                  for el in soup.select('h1, meta[property="og:title"], meta[name="twitter:title"]'):
                      names.append(el.get('content','') if el.name == 'meta' else el.get_text(' ',strip=True))
                  if not any(titles_match(title, name) for name in names):
                      print('Fiche écartée:', title, n, names[:2])
                      continue
                  result = {'allocineUrl': url}
                  result.update(extract_scores(soup))
                  print('AlloCiné vérifié:', title, result)
                  return result
              print('Fiche AlloCiné non vérifiée:', title)
              return {}

          def jsonld_movie(soup, title):
              for script in soup.find_all('script', type='application/ld+json'):
                  try:
                      data = json.loads(script.string or script.get_text())
                  except (TypeError, ValueError):
                      continue
                  stack = [data]
                  while stack:
                      node = stack.pop()
                      if isinstance(node, list):
                          stack.extend(node)
                      elif isinstance(node, dict):
                          for k in ('@graph','mainEntity','itemListElement'):
                              if k in node:
                                  stack.append(node[k])
                          typ = node.get('@type', [])
                          if isinstance(typ, str):
                              typ = [typ]
                          if 'Movie' in typ and norm(node.get('name')) == norm(title):
                              return node
              return {}

          def text_value(value):
              if isinstance(value, str):
                  return value.strip()
              if isinstance(value, dict):
                  return str(value.get('name') or '').strip()
              if isinstance(value, list):
                  return ', '.join(filter(None, (text_value(v) for v in value)))
              return ''

          def ticketing_metadata(url, title):
              try:
                  soup = page(url)
              except requests.RequestException:
                  return {}
              movie = jsonld_movie(soup, title)
              names = [e.get('content','') if e.name == 'meta' else e.get_text(' ',strip=True)
                       for e in soup.select('h1, meta[property="og:title"], meta[name="twitter:title"]')]
              if not movie and not any(norm(title) == norm(name) for name in names):
                  return {}
              out = {}
              if movie:
                  for k in ('genre','director','description'):
                      value = text_value(movie.get(k))
                      if value:
                          out['synopsis' if k == 'description' else k] = value
                  dur = movie.get('duration','')
                  match = re.fullmatch(r'PT(?:(\d+)H)?(?:(\d+)M)?', dur, re.I) if isinstance(dur,str) else None
                  if match:
                      minutes = int(match.group(1) or 0)*60 + int(match.group(2) or 0)
                      if minutes:
                          out['duration'] = f'{minutes//60} h {minutes%60:02d}' if minutes >= 60 else f'{minutes} min'
              img = soup.select_one('meta[property="og:image"]')
              if img and img.get('content'):
                  out['poster'] = urljoin(url, img['content'])
              return out

          with open('films.json', encoding='utf-8') as f:
              old_data = json.load(f)
          old_by_title = {norm(f.get('title')): f for f in old_data.get('films', [])}
          soup = page(CINEMA_URL)
          programme = None
          for script in soup.find_all('script'):
              content = script.string or script.get_text()
              match = re.search(r'\bvar\s+gProg\s*=\s*(\{.*?\})\s*;', content, re.S)
              if match:
                  try:
                      candidate = json.loads(match.group(1))
                  except (TypeError, ValueError):
                      continue
                  if candidate.get('ticketing_web_id') == '99S05SBN':
                      programme = candidate
                      break
          if not programme or not isinstance(programme.get('events'), list):
              raise SystemExit('Arrêt de sécurité : programme introuvable ; films.json inchangé.')

          today = datetime.now(ZoneInfo('Europe/Paris')).date()
          last_day = today + timedelta(days=14)
          films, seen = [], set()
          for event in programme['events']:
              title = str(event.get('title') or '').strip()
              if not title or norm(title) in seen:
                  continue
              sessions, versions = {}, {}
              for show in event.get('sessions', []):
                  stamp = str(show.get('date') or '')
                  if not re.fullmatch(r'\d{12}', stamp):
                      continue
                  try:
                      day_date = date(int(stamp[:4]), int(stamp[4:6]), int(stamp[6:8]))
                  except ValueError:
                      continue
                  if not today <= day_date <= last_day:
                      continue
                  day = day_date.isoformat()
                  hour = stamp[8:10] + ':' + stamp[10:12]
                  sessions.setdefault(day, []).append(hour)
                  features = [str(v).lower() for v in (show.get('display_features') or [])]
                  raw_features = [str(v).lower() for v in (show.get('features') or [])]
                  version = ('VOST' if 'vost' in features or ('vo' in raw_features and 'subtitle' in raw_features)
                             else 'VF' if 'vf' in features or 'vf' in raw_features
                             else 'VO' if 'vo' in features or 'vo' in raw_features else None)
                  if version:
                      versions.setdefault(day, {})[hour] = version
              if not sessions:
                  continue
              seen.add(norm(title))
              old = old_by_title.get(norm(title), {})
              genre = str(event.get('localized_genres') or '').strip()
              director = str(event.get('director') or '').strip()
              synopsis = str(event.get('synopsis') or '').strip()
              poster = str(event.get('bill_url') or '').strip()
              raw_duration = str(event.get('duration') or '').strip()
              duration = ''
              if raw_duration.isdigit() and int(raw_duration)>0:
                  mins = int(raw_duration)
                  duration = f'{mins//60} h {mins%60:02d}' if mins>=60 else f'{mins} min'

              film = {
                  'id': old.get('id') or slug(title),
                  'title': title,
                  'genre': genre or old.get('genre') or 'Non renseigné',
                  'duration': duration or old.get('duration') or 'Non renseignée',
                  'director': director or old.get('director') or 'Non renseigné',
                  'press': old.get('press'),
                  'audience': old.get('audience'),
                  'synopsis': synopsis or old.get('synopsis') or '',
                  'sessions': {d: sorted(set(hours)) for d, hours in sessions.items()},
                  'sessionVersions': versions,
                  'source': CINEMA_URL,
                  'poster': poster or old.get('poster') or '',
              }
              if old.get('allocineUrl'):
                  film['allocineUrl'] = old['allocineUrl']
              if film['poster']:
                  film['posterNote'] = 'Affiche du film (billetterie)'

              # Métadonnées de la fiche de billetterie si un lien fiable est présent.
              for field in ('url', 'link', 'href'):
                  link = event.get(field)
                  if isinstance(link, str) and link.startswith(('http://','https://')):
                      meta = ticketing_metadata(link, title)
                      for k,v in meta.items():
                          if v and (k == 'poster' or not film.get(k) or film[k] in ('Non renseigné','Non renseignée')):
                              film[k] = v
                      break

              notes = allocine_metadata(title, old)
              for field in ('press','audience','allocineUrl'):
                  if notes.get(field):
                      film[field] = notes[field]
              films.append(film)

          print(f'{len(films)} films trouvés sur {len(programme["events"])} événements.')
          if len(films) < 3:
              raise SystemExit('Arrêt de sécurité : moins de 3 films ; films.json inchangé.')
          new_data = {
              'cinema': old_data.get('cinema','Le Grand Palace'),
              'city': old_data.get('city','Les Sables-d’Olonne'),
              'lastChecked': today.isoformat(),
              'weekLabel': f"Programme actualisé le {today.strftime('%d/%m/%Y')}",
              'films': films,
          }
          with open('films.json','w',encoding='utf-8') as f:
              json.dump(new_data,f,ensure_ascii=False,indent=2)
              f.write('\n')
          print(f'Actualisé du {today} au {last_day}.')
          PYCODE
      - name: Publier films.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add films.json
          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
          else
            git commit -m "Actualisation hebdomadaire du programme cinéma"
            git push
          fi
